[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "conversion-truth-auditor"
version = "0.2.0"
description = "Evidence-gated reconciliation of GA4 purchase events against real business outcomes."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
conversion-truth = "conversion_truth.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
